<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King & Queen | AISA Signature Luxury Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --card-bg: rgba(22, 27, 38, 0.7);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa7c11;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-red: #ef4444;
      --glass-border: rgba(212, 175, 55, 0.25);
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height:100vh; padding-bottom: 50px; }
    header {
      background: linear-gradient(180deg, rgba(10,11,14,0.95) 0%, rgba(10,11,14,0.8) 100%);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border);
      position: sticky; top:0; z-index:100; padding: 15px 20px; display:flex; justify-content:space-between; align-items:center;
    }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-logo { width:45px; height:45px; border-radius:50%; border:2px solid var(--gold-primary); object-fit:cover; }
    .brand-title { font-family:'Cinzel', serif; font-size:1.4rem; font-weight:700; color:var(--gold-primary); letter-spacing:1px; }
    .aisabackground { font-size:0.75rem; color:var(--gold-light); letter-spacing:2px; font-weight:600; }
    .admin-btn { background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark)); color:#000; border:none; padding:8px 16px; border-radius:20px; font-weight:700; cursor:pointer; font-size:0.85rem; }
    .container { max-width:1200px; margin: 20px auto; padding:0 15px; }
    .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1200&q=80'); background-size:cover; background-position:center; border-radius:16px; padding: 40px 20px; text-align:center; border: 1px solid var(--glass-border); margin-bottom: 30px; }
    .hero h1 { font-family:'Cinzel', serif; color:var(--gold-primary); font-size:2rem; margin-bottom:10px; }
    .hero p { color:var(--text-sub); max-width:600px; margin:0 auto; font-size:0.95rem; }
    .aisa-badge-hero { display:inline-block; margin-top:15px; background:rgba(212,175,55,0.15); border:1px solid var(--gold-primary); padding:6px 16px; border-radius:30px; font-size:0.8rem; color:var(--gold-light); font-weight:600; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px; }
    .card { background: var(--card-bg); border-radius:16px; border:1px solid var(--glass-border); overflow:hidden; position:relative; }
    .card-img { width:100%; height:200px; object-fit:cover; }
    .card-body { padding:15px; }
    .card-title { font-family:'Cinzel', serif; font-size:1.1rem; color:var(--gold-light); margin-bottom:6px; }
    .card-price { font-size:1.2rem; font-weight:700; color:var(--gold-primary); margin-bottom:10px; }
    .card-meta { font-size:0.85rem; color:var(--text-sub); margin-bottom:15px; display:flex; gap:10px; flex-wrap:wrap; }
    .btn-group { display:flex; gap:10px; }
    .btn-action { flex:1; padding:10px; border-radius:8px; border:none; font-weight:600; cursor:pointer; text-align:center; text-decoration:none; font-size:0.85rem; display:flex; align-items:center; justify-content:center; gap:6px; }
    .btn-wa { background:#25D366; color:#fff; }
    .btn-call { background:var(--gold-primary); color:#000; }
    .aisa-signature { position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.8); border:1px solid var(--gold-primary); color:var(--gold-primary); font-size:0.7rem; font-weight:800; padding:4px 10px; border-radius:20px; letter-spacing:1px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?auto=format&fit=crop&w=200&q=80" alt="Logo" class="brand-logo" id="logoImg">
      <div>
        <div class="brand-title" id="brandTitle">KING & QUEEN</div>
        <div class="aisabackground">AISA SIGNATURE</div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <h1>KING & QUEEN LUXURY</h1>
      <p id="bizDesc">Muna sayar da motoci da gidaje na alfarma a faɗin Najeriya tare da alamar tabbatuwa ta AISA Signature.</p>
      <div class="aisa-badge-hero"><i class="fa-solid fa-gem"></i> Exclusive AISA Signature</div>
    </div>

    <div class="grid" id="itemsGrid">
      <div class="card">
        <span class="aisa-signature">AISA VERIFIED</span>
        <img src="https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?auto=format&fit=crop&w=800&q=80" class="card-img" alt="Peugeot 406">
        <div class="card-body">
          <div class="card-title">Peugeot 406 Luxury Edition</div>
          <div class="card-price">₦5,000,000</div>
          <div class="card-meta">
            <span><i class="fa-solid fa-location-dot"></i> Bauchi</span>
            <span><i class="fa-solid fa-car"></i> Mota</span>
          </div>
          <div class="btn-group">
            <a href="https://wa.me/2348000000000?text=Ina%20sha'awar%20Peugeot%20406" class="btn-action btn-wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
            <a href="tel:08000000000" class="btn-action btn-call"><i class="fa-solid fa-phone"></i> Kira Yanzu</a>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
